<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="g" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#060708"/>
      <stop offset="100%" stop-color="#0b0f1a"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#g)"/>
  <!-- constellation lines: Lepus topology scaled to og canvas -->
  <line x1="130" y1="195" x2="310" y2="255" stroke="#C6D2FF" stroke-width="1.4" opacity=".45"/>
  <line x1="310" y1="255" x2="490" y2="215" stroke="#C6D2FF" stroke-width="1.4" opacity=".45"/>
  <line x1="490" y1="215" x2="640" y2="155" stroke="#C6D2FF" stroke-width="1.4" opacity=".35"/>
  <line x1="130" y1="195" x2="365" y2="320" stroke="#C6D2FF" stroke-width="1.4" opacity=".35"/>
  <line x1="365" y1="320" x2="490" y2="215" stroke="#C6D2FF" stroke-width="1.4" opacity=".35"/>
  <line x1="365" y1="320" x2="660" y2="305" stroke="#C6D2FF" stroke-width="1.4" opacity=".28"/>
  <!-- stars -->
  <circle cx="130" cy="195" r="5.5" fill="#EEF2FF"/>
  <circle cx="310" cy="255" r="7"   fill="#ffffff"/>
  <circle cx="365" cy="320" r="4.5" fill="#EEF2FF" opacity=".9"/>
  <circle cx="490" cy="215" r="4.5" fill="#EEF2FF" opacity=".9"/>
  <circle cx="660" cy="305" r="3.8" fill="#C6D2FF" opacity=".75"/>
  <circle cx="640" cy="155" r="3.8" fill="#C6D2FF" opacity=".75"/>
  <circle cx="430" cy="130" r="3"   fill="#C6D2FF" opacity=".6"/>
  <!-- wordmark + tagline -->
  <text x="120" y="490" fill="#EEF2FF" font-family="Arial, Helvetica, sans-serif" font-size="82" font-weight="200" letter-spacing="16">LEPUS LAB</text>
  <text x="122" y="548" fill="#C6D2FF" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="300" letter-spacing="4">Architecture for Applied AI Systems</text>
</svg>
