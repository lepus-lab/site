<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 56 56">
  <rect width="56" height="56" rx="12" fill="#090B12"/>
  <!-- constellation links (data paths), traced from the index hero -->
  <g stroke="#C6D2FF" stroke-width="0.9" stroke-linecap="round" opacity=".5">
    <line x1="6.0"  y1="21.8" x2="13.9" y2="19.6"/>
    <line x1="13.9" y1="19.6" x2="22.9" y2="21.8"/>
    <line x1="22.9" y1="21.8" x2="31.9" y2="28.6"/>
    <line x1="31.9" y1="28.6" x2="43.2" y2="26.3"/>
    <line x1="39.8" y1="17.3" x2="43.2" y2="26.3"/>
    <line x1="31.9" y1="28.6" x2="34.2" y2="36.5"/>
    <line x1="34.2" y1="36.5" x2="50.0" y2="41.0"/>
    <line x1="17.3" y1="36.5" x2="22.9" y2="41.0"/>
    <line x1="22.9" y1="41.0" x2="34.2" y2="36.5"/>
  </g>
  <!-- dim stars -->
  <circle cx="6.0"  cy="21.8" r="1.2" fill="#C6D2FF" opacity=".55"/>
  <circle cx="45.5" cy="19.6" r="1.2" fill="#C6D2FF" opacity=".55"/>
  <circle cx="50.0" cy="15.1" r="1.0" fill="#C6D2FF" opacity=".55"/>
  <!-- bright stars (nodes) -->
  <circle cx="13.9" cy="19.6" r="1.8" fill="#EEF2FF"/>
  <circle cx="22.9" cy="21.8" r="1.8" fill="#EEF2FF"/>
  <circle cx="31.9" cy="28.6" r="2.8" fill="#EEF2FF"/>
  <circle cx="39.8" cy="17.3" r="2.0" fill="#EEF2FF"/>
  <circle cx="43.2" cy="26.3" r="1.8" fill="#EEF2FF"/>
  <circle cx="17.3" cy="36.5" r="1.8" fill="#EEF2FF"/>
  <circle cx="22.9" cy="41.0" r="1.8" fill="#EEF2FF"/>
  <circle cx="34.2" cy="36.5" r="1.8" fill="#EEF2FF"/>
  <circle cx="50.0" cy="41.0" r="1.8" fill="#EEF2FF"/>
</svg>
